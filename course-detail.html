<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Certificate Course</title>
    <style>
      :root {
        --navy: #133a5e;
        --saffron: #f3a640;
        --red: #d72626;
        --soft: #f5f8fc;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(180deg, #fffaf5 0%, #f3f7fb 100%);
        font-family: Arial, Helvetica, sans-serif;
        color: var(--navy);
      }

      .course-page {
        width: min(760px, 90vw);
        min-height: 60vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 32px;
        text-align: center;
        background: rgba(255, 255, 255, 0.72);
        border: 1px solid rgba(19, 58, 94, 0.08);
        border-radius: 18px;
        box-shadow: 0 18px 40px rgba(19, 58, 94, 0.12);
      }

      .course-name {
        margin: 0;
        font-size: clamp(2rem, 4vw, 4rem);
        line-height: 1.2;
        font-weight: 800;
        color: var(--red);
        letter-spacing: 0.02em;
      }
    </style>
  </head>
  <body>
    <main class="course-page">
      <h1 id="courseTitle" class="course-name">Certificate</h1>
    </main>

    <script>
      var params = new URLSearchParams(window.location.search);
      var title = params.get('title');
      var courseTitle = document.getElementById('courseTitle');

      if (courseTitle) {
        courseTitle.textContent = title || 'Certificate';
      }
    </script>
  </body>
</html>
