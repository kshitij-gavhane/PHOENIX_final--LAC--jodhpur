<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PHOENIX | Participant Login</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #f4f7fb, #eaf0f7);
      font-family: Arial, sans-serif;
    }

    .participant-login-wrap {
      max-width: 560px;
      margin: 48px auto;
      padding: 22px;
    }

    .participant-login-card {
      padding: 32px;
      border: 1px solid #dce5ee;
      border-radius: 20px;
      background: #fff;
      box-shadow: 0 16px 42px #18375518;
    }

    .participant-login-brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .participant-login-brand img {
      width: 72px;
      height: 72px;
      object-fit: contain;
    }

    .participant-login-eyebrow {
      color: #60748a;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 1.7px;
    }

    .participant-login-card h1 {
      margin: 8px 0;
      color: #17324d;
    }

    .participant-login-card > p {
      color: #66788a;
      line-height: 1.6;
    }

    .participant-login-card label {
      display: block;
      margin: 15px 0 6px;
      color: #40556a;
      font-size: 14px;
      font-weight: 700;
    }

    .participant-login-card input {
      box-sizing: border-box;
      width: 100%;
      padding: 13px;
      border: 1px solid #cbd7e3;
      border-radius: 9px;
    }

    .participant-captcha {
      display: grid;
      grid-template-columns: auto 44px 1fr;
      align-items: center;
      gap: 8px;
    }

    .participant-captcha-code {
      padding: 13px;
      border-radius: 8px;
      background: #eef3f8;
      font-weight: 800;
      letter-spacing: 3px;
    }

    .participant-captcha button {
      height: 43px;
      border: 1px solid #cbd7e3;
      border-radius: 8px;
      background: #fff;
      cursor: pointer;
    }

    .participant-login-submit {
      width: 100%;
      margin-top: 20px;
      padding: 14px;
      border: 0;
      border-radius: 9px;
      background: #173b5c;
      color: #fff;
      font-weight: 700;
      cursor: pointer;
    }

    .participant-login-submit:focus-visible,
    .participant-captcha button:focus-visible {
      outline: 3px solid #82afd5;
      outline-offset: 2px;
    }

    .participant-login-message {
      min-height: 20px;
      margin-top: 12px;
      font-size: 14px;
    }

    .participant-login-demo {
      margin-top: 14px;
      padding: 10px;
      border-radius: 8px;
      background: #f7f9fb;
      color: #7b8792;
      font-size: 12px;
    }

    .participant-login-back {
      display: block;
      margin-top: 20px;
      color: #526a82;
      text-align: center;
      text-decoration: none;
    }

    @media (max-width: 600px) {
      .participant-login-wrap {
        margin: 14px auto;
        padding: 14px;
      }

      .participant-login-card {
        padding: 22px;
      }
    }
  </style>
</head>
<body>
  <main class="participant-login-wrap">
    <section class="participant-login-card" aria-labelledby="loginHeading">
      <div class="participant-login-brand">
        <img src="phoenix-logo(1).png" alt="PHOENIX logo">
        <div>
          <div class="participant-login-eyebrow">PROJECT PHOENIX · PARTICIPANT ACCESS</div>
          <h1 id="loginHeading">My PHOENIX Journey</h1>
        </div>
      </div>
      <p>Sign in to view your learning progress, training, certificates, and next steps.</p>
      <form id="juvenileLogin">
        <label for="username">Username / Participant ID</label>
        <input id="username" autocomplete="username" required>
        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="current-password" required>
        <label for="captchaInput">CAPTCHA</label>
        <div class="participant-captcha">
          <span class="participant-captcha-code" id="captchaCode">7K4P2</span>
          <button type="button" id="refresh" aria-label="Refresh CAPTCHA">↻</button>
          <input id="captchaInput" placeholder="Enter code" aria-label="Enter CAPTCHA code" required>
        </div>
        <button class="participant-login-submit" type="submit">Sign in to My Journey</button>
        <div id="msg" class="participant-login-message" aria-live="polite"></div>
      </form>
      <div class="participant-login-demo">Demonstration credentials: <b>himanshugavhane</b> / <b>12345678</b></div>
      <a class="participant-login-back" href="index.html">← Return to main PHOENIX website</a>
    </section>
  </main>
  <script>
    var captcha = '7K4P2';
    var captchaCode = document.getElementById('captchaCode');
    var captchaInput = document.getElementById('captchaInput');
    var message = document.getElementById('msg');

    document.getElementById('refresh').addEventListener('click', function () {
      var characters = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
      captcha = Array.from({ length: 5 }, function () {
        return characters.charAt(Math.floor(Math.random() * characters.length));
      }).join('');
      captchaCode.textContent = captcha;
      captchaInput.value = '';
    });

    document.getElementById('juvenileLogin').addEventListener('submit', function (event) {
      event.preventDefault();

      var username = document.getElementById('username').value.trim();
      var password = document.getElementById('password').value;
      var enteredCaptcha = captchaInput.value.trim().toUpperCase();

      if (enteredCaptcha !== captcha) {
        message.textContent = 'CAPTCHA does not match. Please try again.';
        message.style.color = '#b42318';
        return;
      }

      if (username !== 'himanshugavhane' || password !== '12345678') {
        message.textContent = 'Invalid participant credentials.';
        message.style.color = '#b42318';
        return;
      }

      sessionStorage.setItem('phoenixJuvenileAuth', 'true');
      window.location.assign('juvenile-portal.html');
    });
  </script>
</body>
</html>
